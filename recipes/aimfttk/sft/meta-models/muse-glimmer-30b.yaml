metadata:
  recipeId: "aimfttk/sft/meta-models-muse-glimmer-30b/lora/1gpu/default"
  backend: aimfttk
  modelId: "meta-models/Muse-Glimmer-30B"
  aimId: "meta-models/Muse-Glimmer-30B"
  method: SFT
  isAdapter: true
  acceleratorCount: 1
  hfTokenRequired: false
  sizing:
    downloadsReservedSize: 80Gi
    checkpointsReservedSize: 160Gi
    memoryPerGpu: 192
    cpuPerGpu: 8

defaults:
  epochs: 1
  seed: 42
  logging_interval: 25
  learning_rate: 0.000005
  learning_rate_warmup_steps: 100
  per_accelerator_batch_size: 1
  gradient_accumulation: 1
  lora_alpha: 16
  lora_dropout: 0.05
  lora_rank: 64
  max_context_length: 8192
  save_interval: 500

engine_args:
  distributed_type: "auto-single-process"
  finetuning_config:
    data_conf:
      chat_template_name: "keep-original"
    training_args:
      max_grad_norm: 1.0
      weight_decay: 0.000001
      optim: "adamw_torch"
      lr_scheduler_type: cosine
      logging_strategy: steps
      bf16: true
      report_to:
      - none
      push_to_hub: false
      gradient_checkpointing: true
      gradient_checkpointing_kwargs:
        use_reentrant: false
    peft_conf:
      peft_type: "LORA"
      task_type: "CAUSAL_LM"
      peft_kwargs:
        target_modules: ".*\\.language_model.*\\.(q_proj|k_proj|v_proj|o_proj|up_proj|down_proj|gate_proj)"
    run_conf:
      model_args:
        model_class: AutoModelForImageTextToText
        torch_dtype: bfloat16
        attn_implementation: "sdpa"
      resume_from_checkpoint: auto
