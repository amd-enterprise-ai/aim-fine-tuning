metadata:
  recipeId: "aimfttk/sft/meta-llama-llama-3.2-3b-instruct/full/1gpu/default"
  status: preview
  backend: aimfttk
  modelId: "meta-llama/Llama-3.2-3B-Instruct"
  aimId: "meta-llama/Llama-3.2-3B-Instruct"
  method: SFT
  isAdapter: false
  acceleratorCount: 1
  compatibleAccelerators:
    # MI300X:
  - "74a1"
  - "74a9"
  - "74b5"
  - "74bd"
  # This recipe runs on the following GPUs, however no matching AIM profile is currently available:
  #   # MI325X:
  # - "74a5"
  # - "74b9"
  #   # MI350X:
  # - "75a0"
  # - "75b0"
  #   # MI355X:
  # - "75a3"
  # - "75b3""
  sizing:
    downloadsReservedSize: 10Gi
    checkpointsReservedSize: 512Gi
    memoryPerGpu: 192
    cpuPerGpu: 8

defaults:
  epochs: 1
  seed: 42
  evaluation_interval: 1000
  logging_interval: 25
  learning_rate: 0.000005
  learning_rate_warmup_steps: 100
  per_accelerator_batch_size: 1
  gradient_accumulation: 1
  max_context_length: 8192
  save_interval: 500


engine_args:
  distributed_type: "auto-single-process"
  finetuning_config:
    training_args:
      max_grad_norm: 1.0
      weight_decay: 0.000001
      optim: "adamw_torch"
      lr_scheduler_type: cosine
      logging_strategy: steps
      warmup_ratio: 0.01
      bf16: true
      report_to:
      - none
      push_to_hub: false
      gradient_checkpointing: true
      gradient_checkpointing_kwargs:
        use_reentrant: true
    peft_conf:
      peft_type: "NO_PEFT"
    run_conf:
      model_args:
        torch_dtype: bfloat16
        use_cache: false
        attn_implementation: "flash_attention_2"
      tokenizer_args:
        chat_template_name: "keep-original"
        missing_pad_token_strategy: "bos-repurpose"
      resume_from_checkpoint: auto
