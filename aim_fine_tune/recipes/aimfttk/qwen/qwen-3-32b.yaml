metadata:
  recipeId: "aimfttk/sft/qwen-qwen3-32b/lora/1gpu/default"
  status: preview
  backend: aimfttk
  modelId: "Qwen/Qwen3-32B"
  aimId: "Qwen/Qwen3-32B"
  method: SFT
  isAdapter: true
  acceleratorCount: 1
  hfTokenRequired: false
  compatibleAccelerators:
  # MI300X:
  - "74a1"
  - "74a9"
  - "74b5"
  - "74bd"
  # MI325X:
  - "74a5"
  - "74b9"
  # MI350X:
  - "75a0"
  - "75b0"
  # MI355X:
  - "75a3"
  - "75b3"
  sizing:
    downloadsReservedSize: 80Gi
    checkpointsReservedSize: 160Gi
    memoryPerGpu: 192
    cpuPerGpu: 8

defaults:
  epochs: 1
  seed: 42
  learning_rate: 0.000005
  learning_rate_warmup_steps: 100
  logging_interval: 25
  per_accelerator_batch_size: 1
  lora_alpha: 16
  lora_dropout: 0.05
  lora_rank: 64
  max_context_length: 8192
  save_interval: 500

engine_args:
  distributed_type: "auto-deepspeed-stage3"
  finetuning_config:
    data_conf:
      chat_template_name: "keep-original"
    training_args:
      max_grad_norm: 1.0
      weight_decay: 0.000001
      optim: "adamw_torch"
      lr_scheduler_type: cosine
      logging_strategy: steps
      bf16: true
      report_to:
      - none
      push_to_hub: false
      gradient_checkpointing: false
    peft_conf:
      peft_type: "LORA"
      task_type: "CAUSAL_LM"
      peft_kwargs:
        target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
        - up_proj
        - down_proj
        - gate_proj
    run_conf:
      model_args:
        torch_dtype: bfloat16
        attn_implementation: "flash_attention_2"
